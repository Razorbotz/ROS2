controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    falcon_10_controller:
      type: forward_command_controller/ForwardCommandController
    
    falcon_11_controller:
      type: forward_command_controller/ForwardCommandController

    falcon_12_controller:
      type: forward_command_controller/ForwardCommandController

    falcon_13_controller:
      type: forward_command_controller/ForwardCommandController

falcon_10_controller:
  ros__parameters:
    joints:
      - FL_Wheel_Joint
    interface_name: velocity

falcon_11_controller:
  ros__parameters:
    joints:
      - FR_Wheel_Joint
    interface_name: velocity

falcon_12_controller:
  ros__parameters:
    joints:
      - BL_Wheel_Joint
    interface_name: velocity

falcon_13_controller:
  ros__parameters:
    joints:
      - BR_Wheel_Joint
    interface_name: velocity