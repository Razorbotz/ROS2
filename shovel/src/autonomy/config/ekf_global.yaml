ekf_global_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: base_link
    base_link_frame: base_link
    world_frame: map

    # Sensor 0: wheel odometry
    odom0: /p3d/odom
    odom0_config: [true, true, false,    # x, y, z
                   false, false, true,    # roll, pitch, yaw
                   false, false, false,   # vx, vy, vz
                   false, false, false,   # vroll, vpitch, vyaw
                   false, false, false]   # ax, ay, az
    initial_state: [1.9, 1.75, 0.0,    # x, y, z
                    0.0, 0.0, 3.14159,  # roll, pitch, yaw (facing -X = pi)
                    0.0, 0.0, 0.0,      # vx, vy, vz
                    0.0, 0.0, 0.0,      # vroll, vpitch, vyaw
                    0.0, 0.0, 0.0]      # ax, ay, az
    odom0_differential: true

    # Sensor 1: AprilTag absolute pose (in map frame)
    pose0: /apriltag_pose
    pose0_config: [true, true, false,     # x, y, z
                   false, false, true,     # roll, pitch, yaw
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false

    use_sim_time: true